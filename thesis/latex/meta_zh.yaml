title: |
  在线二部匹配中预测的局限性：一项统一实验研究
author: |
  [作者姓名] —— 硕士学位论文（草稿）
documentclass: ctexrep
classoption:
  - UTF8
  - fontset=macnew
geometry: margin=1in
linkcolor: black
abstract: |
  面向在线二部匹配——请求逐个到达，每个请求必须在看到其余输入之前被匹配到一个资源或被丢弃——的学习
  增强（"带预测"）算法近年大量涌现。一族消费的是"每个资源会被争用到什么程度"的预测。另一族则在提交
  "跟随预测"或"回退到免预测基线"之前，先在一段较短的请求前缀（占实例的比例趋于零）上检验一个关于到达
  构成的预测。这些算法此前均被孤立地研究。本文给出首个统一实验研究。我们把它们全部置于同一套评测
  框架下：共同的结构化预测误差模型、共同的最优解、以及置信区间。我们在合成图、六个真实世界图与真实
  请求 trace 上运行它。核心发现是：在平均情况输入上，预测的价值是鲁棒性保险，而非性能杠杆。在我们的
  少类型实例上，免预测基线本已达到离线最优的 $0.99$，留给好建议的余地不足 $0.01$；而无防护地跟随预测
  在同一批实例上会崩到 $0.47$——成熟算法的实际价值恰恰在于它们从不崩溃。本文以一个理论展望收束：
  一条已证明的一致性/鲁棒性权衡不等式，以及对本文自身实验的一种定量解读——判定是否信任建议所需的前缀
  按建议上升空间的平方反比增长。完整的形式化发展属于独立工作，本文除该不等式外不声称任何定理。我们的
  实验给出一句话，而展望说明为何理应如此：在平均情况匹配上，建议的上升空间小于判定其是否可信所需付出
  的代价。
