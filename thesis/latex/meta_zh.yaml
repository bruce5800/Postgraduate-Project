title: |
  在线二部匹配中预测的局限性：一项统一实验研究
author: |
  [作者姓名] —— 硕士学位论文（草稿）
documentclass: ctexrep
classoption:
  - UTF8
  - fontset=macnew
geometry: margin=1in
linkcolor: black
abstract: |
  在线二部匹配是不可撤销顺序分配的标准模型：资源事先已知，请求逐个到达，每个请求都必须在
  看到其余输入之前，被匹配到一个空闲且兼容的资源，或被丢弃。它是在线广告、网约车派单与
  请求路由背后的抽象。近年一条研究路线为这类算法提供关于输入的**预测**，并要求预测准确时
  性能接近最优（**一致性**）、预测错误时不出现损失（**鲁棒性**）。

  针对匹配问题存在两族这样的算法，但此前各自被孤立分析，且几乎全部停留在最坏情况理论，
  因此预测究竟值多少并不清楚。本项目把它们放到同一套评测框架上（相同的图、到达序列、
  最优解与配对随机种子，四种结构化误差模型，全程 95% 置信区间），先复现一项已发表的实验
  研究做校验，再在合成图族、六个真实世界图与真实 trace 上运行。各种设定下结论一致：
  免预测基线本已接近最优（离线最优的 $0.990$），留给好预测的余地不足 $0.01$，而无防护地
  跟随预测会崩到 $0.472$。此处预测是**鲁棒性保险，而非性能杠杆**：本文研究的是预测的
  局限，而不是一个更好的算法。

  - 我搭建了实验框架，并在加入任何与预测相关的工作之前，用 Borodin、Karavasilis 与
    Pankratov 已发表的研究对其做了校验（第 8--12 页）。
  - 我做出了两族算法的首个统一基准：按原论文实现了 Aamand--Chen--Indyk、Choo 等人与
    Burathep--Erlebach--Moses 的算法，并统一到共同的误差模型与最优解上；其中每一处
    显著差距都出现在**下行**一侧（第 13--15 页）。
  - 我刻画了残余损失由什么支配：Kendall-$\tau$ 顺序误差（Spearman $\rho=0.979$），
    而已知的 $n-\mathrm{LIS}$ 界宽松 $16$--$75$ 倍；顺序依赖性本身是
    Aamand--Chen--Indyk 的结论（第 16--17 页）。
  - 我完成了对测试-回退机制的首个实证研究（一种更准确的检验反而给出更差决策的病态，
    以及一个分辨率极限；第 18--21 页），并在六个真实图与一个廉价的非机器学习预测器上
    验证了外部效度（第 22--25 页）。
  - 我报告了两个负结果（第 26--32 页），并证明了一条一致性/鲁棒性权衡不等式，据此在基准
    参数下不可捕获的上升空间约为 $0.004$，恰好是实测到的量级（第 33--37 页）。
